# OpenTCS Plus 一键部署编排
# 目标平台: linux/amd64
# 用法: ./deploy.sh up  或  ./install.sh

x-platform: &platform
  platform: linux/amd64

services:
  # ==================== 中间件 ====================

  mysql:
    <<: *platform
    image: mysql:8.0
    container_name: opentcs-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MySQL@2024!Root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opentcsplus}
      MYSQL_USER: ${MYSQL_USER:-opentcs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Opentcs@2024!DB}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./config/mysql/init.d:/docker-entrypoint-initdb.d:ro
    networks:
      - opentcs-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-MySQL@2024!Root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
      - --innodb_buffer_pool_size=256M

  flyway:
    <<: *platform
    image: flyway/flyway:10-alpine
    container_name: opentcs-flyway
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../../db/migration:/flyway/sql/migration:ro
      - ../../db/repeatable:/flyway/sql/repeatable:ro
    command: >
      -url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-opentcsplus}?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      -user=root
      -password=${MYSQL_ROOT_PASSWORD:-MySQL@2024!Root}
      -locations=filesystem:/flyway/sql/migration,filesystem:/flyway/sql/repeatable
      -connectRetries=60
      migrate
    networks:
      - opentcs-net
    restart: "no"

  redis:
    <<: *platform
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: opentcs-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-Redis@2024!Cache}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    networks:
      - opentcs-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Redis@2024!Cache}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  emqx:
    <<: *platform
    image: ${EMQX_IMAGE:-emqx/emqx:5.7.2}
    container_name: opentcs-emqx
    hostname: opentcs-emqx
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    environment:
      # 使用 127.0.0.1，避免容器内 emqx ctl/ping 因节点名解析失败导致 unhealthy
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-Emqx@2024!Admin}
      EMQX_LOG__CONSOLE_HANDLER__LEVEL: warning
    volumes:
      - emqx-data:/var/lib/emqx
      - emqx-log:/var/log/emqx
    networks:
      - opentcs-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18083/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ==================== 应用服务 ====================

  backend:
    <<: *platform
    image: opentcs-admin:${APP_VERSION:-latest}
    container_name: opentcs-admin
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8088}:8088"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 应用默认 port=8080，部署统一改为 8088（与 nginx/健康检查一致）
      SERVER_PORT: "8088"
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-opentcsplus}?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${MYSQL_USER:-opentcs}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_PASSWORD:-Opentcs@2024!DB}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-Redis@2024!Cache}
      SPRING_DATA_REDIS_DATABASE: 0
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_SERVERURLS_0: "tcp://emqx:1883"
      MQTT_CLIENTID: "${MQTT_CLIENT_ID:-opentcs-server}"
      MQTT_TOPICS_0: "${MQTT_TOPIC:-/opentcs/#}"
      MQTT_USERNAME: "${MQTT_USERNAME:-}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
    depends_on:
      mysql:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - opentcs-net
    volumes:
      - backend-logs:/app/logs
      - backend-upload:/app/upload

  frontend:
    <<: *platform
    image: opentcs-web:${APP_VERSION:-latest}
    container_name: opentcs-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - opentcs-net

networks:
  opentcs-net:
    driver: bridge
    name: opentcs-net

volumes:
  mysql-data:
  redis-data:
  emqx-data:
  emqx-log:
  backend-logs:
  backend-upload:
